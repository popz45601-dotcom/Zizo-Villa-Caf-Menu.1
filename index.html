h1,h2{font-family:Amiri,serif;margin:0}
.sw{display:flex;gap:8px;padding:12px;max-width:560px;margin:0 auto}
.sw button{flex:1;font:700 17px inherit;font-family:inherit;padding:10px;border-radius:999px;border:2px solid var(--ac);background:transparent;color:var(--tx);cursor:pointer}
.sw button.on{background:var(--ac);color:var(--ink)}
.hero{text-align:center;padding:10px 16px 18px}
.logo{width:130px;height:130px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);margin:0 auto 8px;display:block}
.vl{width:130px;height:130px;border-radius:50%;border:3px solid var(--ac);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font:700 38px Amiri,serif;color:var(--ac);background:#0003}
.hero h1{font-size:clamp(38px,9vw,60px);color:var(--ac);line-height:1.2}
.hero p{margin:4px 0 14px;font-size:17px;opacity:.9}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cta a{background:var(--ac);color:var(--ink);font-weight:700;text-decoration:none;padding:9px 20px;border-radius:999px}
.cta a.alt{background:transparent;color:var(--tx);border:2px solid var(--ac)}
nav{position:sticky;top:env(safe-area-inset-top);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg);border-bottom:2px solid var(--ac);scrollbar-width:none}
nav a{flex:none;color:var(--tx);text-decoration:none;font-weight:600;font-size:15px;padding:3px 14px;border-radius:999px;border:1px solid #ffffff55;cursor:pointer}
nav a:hover,nav a.on{background:var(--ac);color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:8px 14px 30px}
section{margin-top:28px;scroll-margin-top:70px}
section h2{display:inline-block;background:var(--ac);color:var(--ink);font-size:30px;padding:0 22px;border-radius:6px 22px 6px 22px}
.note{font-size:14px;opacity:.85;margin:8px 0 0}
.box{margin-top:12px;background:var(--card);border:2px solid var(--ac);border-radius:18px;padding:4px 16px}
.it{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #ffffff30}
.it:last-child{border:0}.it b{display:block;font-size:17px}.it small{display:block;font-size:14px;opacity:.85;line-height:1.5}
.pr{display:flex;gap:6px;flex:none}
.pr span{background:#fff;color:var(--ink);font-weight:700;font-size:19px;min-width:46px;text-align:center;border-radius:999px;padding:0 10px;line-height:1.6}
.cur{font-size:13px;opacity:.8;text-align:center;margin-top:20px}
footer{background:#0006;border-top:2px solid var(--ac);text-align:center;padding:22px 14px 30px}
footer h2{color:var(--ac);font-size:28px}
footer a{color:var(--ac);font-weight:700;text-decoration:none;direction:ltr;unicode-bidi:isolate;display:inline-block;margin:2px 8px;font-size:18px}
.hid{display:none}
#wm.rest{-webkit-mask-image:radial-gradient(circle at center,#000 28%,transparent 36%);mask-image:radial-gradient(circle at center,#000 28%,transparent 36%)}
#wm.cafe{background-size:min(60vw,380px) auto;opacity:.1}
.logo2{height:170px;width:auto;display:block;margin:0 auto 8px}
#wm{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.09;background:center/min(85vw,560px) no-repeat}
.sw,.hero,main,.cur,footer{position:relative;z-index:1}
@media(max-width:480px){.it{align-items:flex-start;flex-direction:column;gap:4px}}
